[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-news-oss"
version = "0.3.0"
description = "自托管 AI 资讯聚合站：定时抓取、时间衰减热榜、AI 摘要"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# 依赖与 requirements.txt 保持一致（改这里记得同步那边）
dependencies = [
    "APScheduler==3.11.3",
    "Jinja2==3.1.6",
    "MarkupSafe==3.0.4",
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anyio==4.15.1",
    "babel==2.18.0",
    "certifi==2026.7.22",
    "chardet==5.2.0",
    "charset-normalizer==3.5.2",
    "click==8.5.0",
    "courlan==1.4.0",
    "cssselect==1.3.0",
    "dateparser==1.4.3",
    "fastapi==0.143.0",
    "feedparser-sgmllib==2.1.0",
    "feedparser==6.0.14",
    "h11==0.16.0",
    "htmldate==1.11.0",
    "idna==3.20",
    "jusText==3.0.2",
    "lxml==6.1.3",
    "lxml_html_clean==0.4.5",
    "opentelemetry-api==1.45.1",
    "pydantic==2.14.1",
    "pydantic_core==2.50.1",
    "python-dateutil==2.9.0.post0",
    "pytz==2026.5",
    "readability-lxml==0.9",
    "regex==2026.9.29",
    "requests==2.34.2",
    "six==1.17.0",
    "starlette==1.7.0",
    "tld==0.13.2",
    "trafilatura==2.3.1",
    "typing-inspection==0.4.4",
    "typing_extensions==4.16.0",
    "tzlocal==5.4.4",
    "urllib3==2.8.0",
    "uvicorn==0.54.0",
]

[project.urls]
Homepage = "https://github.com/aspiring0/ai-news-oss"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # starlette 1.x 的 testclient 对 httpx 的弃用提示，与本项目无关
    "ignore:Using `httpx` with `starlette.testclient`",
]
