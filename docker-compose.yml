services:
  ai-news:
    build: .
    container_name: ai-news-oss
    env_file:
      - .env
    environment:
      # 容器内固定监听 8000（覆盖 env_file 注入的 PORT，避免宿主改 PORT 后映射错位）
      - PORT=8000
      - DB_PATH=/data/news.db
      - TZ=Asia/Shanghai
    volumes:
      - ./data:/data
    ports:
      - "${PORT:-8000}:8000"
    restart: unless-stopped
