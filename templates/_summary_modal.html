<!-- 摘要弹窗：四段式（核心/说人话/关键细节/原文链接）+ 重新生成 + 关闭 -->
<div id="sum-modal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head">
      <span id="sum-title" class="modal-title"></span>
      <button class="modal-close" onclick="closeSummary()" aria-label="关闭">✕</button>
    </div>
    <div id="sum-body" class="modal-body"><p class="loading">正在生成摘要…</p></div>
    <div class="modal-foot">
      <button id="sum-regen" class="btn" onclick="regenSummary()">↻ 重新生成</button>
      <a id="sum-link" class="btn link" href="#" target="_blank" rel="noopener">打开原文 ↗</a>
    </div>
  </div>
</div>
<style>
  .modal.hidden { display: none; }
  .modal { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: flex;
           align-items: center; justify-content: center; z-index: 50; padding: 16px; }
  .modal-card { background: var(--card, #fff); color: var(--text, #1f2328); border-radius: 12px; max-width: 640px; width: 100%;
                max-height: 85vh; display: flex; flex-direction: column;
                box-shadow: 0 20px 50px rgba(0,0,0,.2); }
  .modal-head { display: flex; justify-content: space-between; align-items: center; gap: 10px;
                padding: 14px 16px; border-bottom: 1px solid var(--border, #e5e7eb); }
  .modal-title { font-weight: 700; font-size: 15px; overflow-wrap: anywhere; }
  .modal-close { border: none; background: none; font-size: 18px; cursor: pointer;
                 color: var(--muted, #6b7280); line-height: 1; flex-shrink: 0; }
  .modal-body { padding: 4px 16px 14px; overflow-y: auto; font-size: 14px; line-height: 1.7; }
  .sec { margin-top: 12px; }
  .sec h4 { margin: 0 0 4px; font-size: 13px; color: var(--blue, #2563eb); }
  .sec p { margin: 0; overflow-wrap: anywhere; }
  .sum-link-section a { word-break: break-all; }
  .sum-cached { font-size: 11px; color: var(--muted, #9ca3af); margin: 10px 0 0; }
  .sum-err { color: #b91c1c; margin: 8px 0; }
  .loading { color: var(--muted, #999); margin: 8px 0; }
  .modal-foot { padding: 12px 16px; border-top: 1px solid var(--border, #e5e7eb);
                display: flex; gap: 10px; }
  .btn { border: 1px solid var(--border, #e5e7eb); background: var(--bg, #f9fafb); color: var(--text, #1f2328);
         border-radius: 6px; padding: 6px 14px; cursor: pointer; font-size: 13px; text-decoration: none; }
  .btn.link { color: var(--blue, #2563eb); }
  .btn:hover { filter: brightness(.96); }
  @media (max-width: 640px) { .modal { padding: 10px; } }
</style>
<script>
let _sumUrl = "";
async function openSummary(url, title) {
  _sumUrl = url;
  document.getElementById("sum-title").textContent = title;
  document.getElementById("sum-link").href = url;
  document.getElementById("sum-body").innerHTML = '<p class="loading">正在生成摘要…</p>';
  document.getElementById("sum-modal").classList.remove("hidden");
  await loadSummary(false);
}
async function loadSummary(regen) {
  const body = document.getElementById("sum-body");
  try {
    const r = await fetch("/api/summary?url=" + encodeURIComponent(_sumUrl) + (regen ? "&regenerate=1" : ""));
    const d = await r.json();
    if (!d.ok) { body.innerHTML = '<p class="sum-err">摘要暂不可用（' + (d.message || "未知错误") + "）</p>"; return; }
    const s = d.summary;
    body.innerHTML =
      '<div class="sec"><h4>① 一句话核心</h4><p>' + esc(s.core) + "</p></div>" +
      '<div class="sec"><h4>② 说人话</h4><p>' + esc(s.plain) + "</p></div>" +
      '<div class="sec"><h4>③ 关键细节</h4><p>' + esc(s.details).replace(/\n/g, "<br>") + "</p></div>" +
      '<div class="sec sum-link-section"><h4>④ 原文链接</h4><p><a href="' + esc(_sumUrl) + '" target="_blank" rel="noopener">' + esc(_sumUrl) + "</a></p></div>" +
      (s._cached ? '<p class="sum-cached">来自缓存（' + esc(s._created_at || "") + "）</p>" : "");
  } catch (e) {
    body.innerHTML = '<p class="sum-err">摘要暂不可用（网络错误）</p>';
  }
}
function regenSummary() {
  document.getElementById("sum-body").innerHTML = '<p class="loading">正在重新生成…</p>';
  loadSummary(true);
}
function closeSummary() { document.getElementById("sum-modal").classList.add("hidden"); }
document.getElementById("sum-modal").addEventListener("click", function(e) {
  if (e.target === this) closeSummary();
});
document.addEventListener("keydown", function(e) {
  if (e.key === "Escape") closeSummary();
});
async function toggleBookmark(url, btn) {
  try {
    const r = await fetch("/api/bookmark", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({url: url})
    });
    const d = await r.json();
    if (d.ok) btn.textContent = d.bookmarked ? "⭐" : "☆";
  } catch (e) { /* 静默失败 */ }
}
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c) {
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
/* 相对时间：今天显示「HH:MM · 刚刚/x 分钟前/x 小时前」，昨天带时间，更早回落日期 */
function relTime(iso) {
  const d = new Date(iso);
  const now = new Date();
  const sec = (now.getTime() - d.getTime()) / 1000;
  const hm = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  const sameDay = d.toDateString() === now.toDateString();
  if (sec < 60) return sameDay ? hm + " · 刚刚" : hm;
  const m = Math.floor(sec / 60);
  if (m < 60) return sameDay ? hm + " · " + m + " 分钟前" : hm;
  const h = Math.floor(m / 60);
  if (sameDay && h < 24) return hm + " · " + h + " 小时前";
  const dd = Math.floor(h / 24);
  if (dd === 1) return "昨天 " + hm;
  if (dd < 15) return dd + " 天前";
  return (d.getMonth() + 1) + "-" + d.getDate();
}
document.querySelectorAll("time.rel").forEach(function (t) {
  t.textContent = relTime(t.getAttribute("datetime"));
});
</script>
