<!-- 摘要弹窗：点击标题弹出；含四段式 + 原文链接 + 重新生成 -->
<div id="sum-modal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head">
      <span id="sum-title" class="modal-title"></span>
      <button class="modal-close" onclick="closeSummary()">✕</button>
    </div>
    <div id="sum-body" class="modal-body"><p class="loading">正在生成摘要…</p></div>
    <div class="modal-foot">
      <button id="sum-regen" class="btn" onclick="regenSummary()">↻ 重新生成</button>
      <a id="sum-link" class="btn link" href="#" target="_blank" rel="noopener">原文链接 ↗</a>
    </div>
  </div>
</div>
<style>
  .modal.hidden { display: none; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
  .modal-card { background: #fff; border-radius: 12px; max-width: 640px; width: 100%; max-height: 85vh; display: flex; flex-direction: column; }
  .modal-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid #eee; }
  .modal-title { font-weight: 700; font-size: 15px; }
  .modal-close { border: none; background: none; font-size: 18px; cursor: pointer; }
  .modal-body { padding: 14px 16px; overflow-y: auto; font-size: 14px; line-height: 1.7; }
  .modal-body h4 { margin: 12px 0 4px; font-size: 13px; color: #1a73e8; }
  .modal-body h4:first-child { margin-top: 0; }
  .modal-foot { padding: 12px 16px; border-top: 1px solid #eee; display: flex; gap: 10px; }
  .btn { border: 1px solid #ddd; background: #f7f7f8; border-radius: 6px; padding: 6px 14px; cursor: pointer; font-size: 13px; text-decoration: none; color: #222; }
  .btn.link { color: #1a73e8; }
  .loading { color: #999; }
  .sum-err { color: #b91c1c; }
  .sum-cached { font-size: 11px; color: #999; margin-top: 10px; }
  .star { border: none; background: none; cursor: pointer; font-size: 16px; padding: 0 4px; }
</style>
<script>
let _sumUrl = "";
async function openSummary(url, title) {
  _sumUrl = url;
  document.getElementById("sum-title").textContent = title;
  document.getElementById("sum-link").href = url;
  document.getElementById("sum-body").innerHTML = '<p class="loading">正在生成摘要…</p>';
  document.getElementById("sum-modal").classList.remove("hidden");
  await loadSummary(false);
}
async function loadSummary(regen) {
  const body = document.getElementById("sum-body");
  try {
    const r = await fetch("/api/summary?url=" + encodeURIComponent(_sumUrl) + (regen ? "&regenerate=1" : ""));
    const d = await r.json();
    if (!d.ok) { body.innerHTML = '<p class="sum-err">摘要暂不可用（' + (d.message || "未知错误") + "）</p>"; return; }
    const s = d.summary;
    body.innerHTML =
      "<h4>📌 一句话核心</h4><p>" + esc(s.core) + "</p>" +
      "<h4>💬 说人话</h4><p>" + esc(s.plain) + "</p>" +
      "<h4>🔑 关键细节</h4><p>" + esc(s.details).replace(/\n/g, "<br>") + "</p>" +
      (s._cached ? '<p class="sum-cached">来自缓存（' + esc(s._created_at || "") + "）</p>" : "");
  } catch (e) {
    body.innerHTML = '<p class="sum-err">摘要暂不可用（网络错误）</p>';
  }
}
function regenSummary() {
  document.getElementById("sum-body").innerHTML = '<p class="loading">正在重新生成…</p>';
  loadSummary(true);
}
function closeSummary() { document.getElementById("sum-modal").classList.add("hidden"); }
document.getElementById("sum-modal").addEventListener("click", function(e) {
  if (e.target === this) closeSummary();
});
async function toggleBookmark(url, btn) {
  try {
    const r = await fetch("/api/bookmark", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({url: url})
    });
    const d = await r.json();
    if (d.ok) btn.textContent = d.bookmarked ? "⭐" : "☆";
  } catch (e) { /* 静默失败 */ }
}
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c) {
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
</script>
