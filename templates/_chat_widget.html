<!-- Agent 聊天框 v2：流式 + 确认 + 页面上下文 -->
<div id="chat-fab" title="AI 资讯助手">💬</div>
<div id="chat-panel" class="hidden">
  <div class="chat-head">
    <b>AI 资讯助手</b>
    <span>
      <button id="chat-clear" title="清空对话" style="border:none;background:none;color:var(--muted);cursor:pointer;font-size:12px">清空</button>
      <button id="chat-export" title="导出为 Markdown" style="border:none;background:none;color:var(--muted);cursor:pointer;font-size:12px;margin-left:6px">导出</button>
      <button id="chat-close" title="收起" style="border:none;background:none;color:var(--muted);cursor:pointer;font-size:16px">✕</button>
    </span>
  </div>
  <div id="chat-messages" class="chat-body">
    <div class="chat-hint">用自然语言操控你的资讯台：<br>·「最近有什么 Claude 新闻？」<br>·「热榜前 5 给我看看」<br>·「这条帮我收藏一下」<br>·「别再推融资类的了」</div>
  </div>
  <div id="chat-tools" class="chat-tools hidden"></div>
  <div id="chat-confirm" class="chat-confirm hidden">
    <span id="chat-confirm-text"></span>
    <span>
      <button id="chat-confirm-yes">✓ 确认</button>
      <button id="chat-confirm-no">✗ 取消</button>
    </span>
  </div>
  <div class="chat-input-row">
    <input type="text" id="chat-input" placeholder="输入消息…" aria-label="消息">
    <button id="chat-send">发送</button>
  </div>
</div>

<style>
  #chat-fab { position:fixed;bottom:20px;right:20px;z-index:80;width:48px;height:48px;
    border-radius:50%;border:none;background:var(--blue);color:#fff;font-size:22px;cursor:pointer;
    box-shadow:0 4px 12px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center; }
  #chat-fab:hover{transform:scale(1.08)}
  #chat-panel.hidden{display:none}
  #chat-panel{position:fixed;bottom:80px;right:20px;z-index:81;width:min(400px,calc(100vw - 32px));
    max-height:min(560px,calc(100vh - 120px));background:var(--card);border:1px solid var(--border);
    border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.18);display:flex;flex-direction:column;overflow:hidden}
  .chat-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;
    border-bottom:2px solid var(--text);background:var(--bg)}
  .chat-head b{font-family:var(--serif);font-size:14px}
  .chat-body{flex:1;overflow-y:auto;padding:12px;font-size:13.5px;line-height:1.65;
    display:flex;flex-direction:column;gap:10px}
  .chat-hint{color:var(--muted);font-size:12px;text-align:center;padding:16px 8px;line-height:2}
  .chat-msg{max-width:88%;padding:8px 12px;border-radius:10px;overflow-wrap:anywhere}
  .chat-msg.user{align-self:flex-end;background:var(--blue-bg);color:var(--blue-dark);border:1px solid var(--blue)}
  .chat-msg.bot{align-self:flex-start;background:var(--bg);border:1px solid var(--border)}
  .chat-msg .chat-sources{margin-top:6px;font-size:11px;color:var(--muted)}
  .chat-msg .chat-sources a{color:var(--blue);text-decoration:none}
  .chat-loading{color:var(--muted);font-size:12px;align-self:flex-start;padding:4px 12px}
  .chat-loading::after{content:"…";animation:dots 1.5s infinite}
  @keyframes dots{0%,100%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
  .chat-tools{padding:6px 12px;border-top:1px dashed var(--border);font-size:11px;color:var(--muted);
    max-height:80px;overflow-y:auto;background:var(--bg)}
  .chat-tools.hidden{display:none}
  .chat-tools .tool-line{margin:2px 0}
  .chat-confirm{display:flex;justify-content:space-between;align-items:center;gap:8px;
    padding:10px 12px;border-top:2px solid var(--amber-text);background:var(--amber-bg);
    font-size:12.5px;color:var(--amber-text)}
  .chat-confirm.hidden{display:none}
  .chat-confirm button{border:1px solid var(--amber-text);background:none;color:var(--amber-text);
    border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;margin-left:4px}
  .chat-confirm #chat-confirm-yes{background:var(--amber-text);color:#fff}
  .chat-input-row{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--border)}
  .chat-input-row input{flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:8px;
    background:var(--bg);color:var(--text);font-size:13px}
  .chat-input-row input:focus{outline:none;border-color:var(--blue)}
  .chat-input-row button{border:none;background:var(--blue);color:#fff;border-radius:8px;
    padding:6px 16px;font-size:13px;cursor:pointer}
  .chat-input-row button:disabled{opacity:.5}
</style>

<script>
(function () {
  var fab = document.getElementById("chat-fab");
  var panel = document.getElementById("chat-panel");
  var msgs = document.getElementById("chat-messages");
  var input = document.getElementById("chat-input");
  var sendBtn = document.getElementById("chat-send");
  var toolsBox = document.getElementById("chat-tools");
  var confirmBox = document.getElementById("chat-confirm");
  var confirmText = document.getElementById("chat-confirm-text");
  var sessionId = "";

  fab.addEventListener("click", function () { panel.classList.toggle("hidden"); if (!panel.classList.contains("hidden")) input.focus(); });
  document.getElementById("chat-close").addEventListener("click", function () { panel.classList.add("hidden"); });
  document.getElementById("chat-clear").addEventListener("click", async function () {
    if (sessionId) await fetch("/api/chat?session_id=" + encodeURIComponent(sessionId), { method: "DELETE" });
    sessionId = ""; msgs.innerHTML = "";
    toolsBox.classList.add("hidden"); confirmBox.classList.add("hidden");
  });

  // A9: 导出对话为 Markdown
  document.getElementById("chat-export").addEventListener("click", async function () {
    if (!sessionId) { alert("没有可导出的对话"); return; }
    try {
      const r = await fetch("/api/chat/history?session_id=" + encodeURIComponent(sessionId));
      const d = await r.json();
      if (!d.messages.length) { alert("对话为空"); return; }
      var lines = ["# AI 资讯助手对话记录", ""];
      d.messages.forEach(function (m) {
        lines.push(m.role === "user" ? "**👤 我：**" : "**🤖 助手：**");
        lines.push(m.content);
        lines.push("");
      });
      var text = lines.join("\n");
      (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject())
        .then(function () { alert("已复制到剪贴板（Markdown 格式）"); })
        .catch(function () {
          var ta = document.createElement("textarea");
          ta.value = text; document.body.appendChild(ta); ta.select();
          document.execCommand("copy"); ta.remove();
          alert("已复制到剪贴板");
        });
    } catch (e) { alert("导出失败"); }
  });

  // A11: 打开聊天时自动给今日简报（仅首次，无历史时）
  fab.addEventListener("click", async function () {
    if (!sessionId && !msgs.querySelector(".chat-msg")) {
      // 自动加载今日简报
      var briefing = document.createElement("div");
      briefing.className = "chat-msg bot";
      briefing.innerHTML = '<span style="color:var(--muted)">正在获取今日简报…</span>';
      msgs.appendChild(briefing);
      try {
        const r = await fetch("/api/chat/stream", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: "给我今日热榜前 5 的简报，每条一句话即可", session_id: "" })
        });
        const reader = r.body.getReader();
        const decoder = new TextDecoder();
        var buf = "";
        briefing.remove();
        while (true) {
          var chunk = await reader.read();
          if (chunk.done) break;
          buf += decoder.decode(chunk.value, { stream: true });
          var lines2 = buf.split("\n");
          buf = lines2.pop();
          for (var j = 0; j < lines2.length; j++) {
            var l = lines2[j].trim();
            if (!l.startsWith("data: ")) continue;
            try {
              var ev2 = JSON.parse(l.slice(6));
              if (ev2.type === "reply") { addMsg("bot", ev2.content); }
              else if (ev2.type === "tool") { addToolLine(ev2.tool, ev2.args); }
              else if (ev2.type === "tool_result") { /* skip */ }
              else if (ev2.type === "done") { sessionId = ev2.session_id; }
            } catch (e) {}
          }
        }
      } catch (e) {
        briefing.remove();
        addMsg("bot", "今日简报获取失败，请手动提问。");
      }
    }
  });

  // 确认按钮
  document.getElementById("chat-confirm-yes").addEventListener("click", function () {
    confirmBox.classList.add("hidden");
    send("是");
  });
  document.getElementById("chat-confirm-no").addEventListener("click", function () {
    confirmBox.classList.add("hidden");
    send("不");
  });

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function mdToHtml(md) {
    // 极简 Markdown → HTML（加粗/表格/列表/代码/链接）
    var s = esc(md);
    // 代码块
    s = s.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre style="background:var(--bg);padding:8px;border-radius:6px;font-size:12px;overflow-x:auto">$2</pre>');
    // 行内代码
    s = s.replace(/`([^`]+)`/g, '<code style="background:var(--bg);padding:1px 4px;border-radius:3px;font-size:12px">$1</code>');
    // 加粗
    s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    // 链接 [text](url)
    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener" style="color:var(--blue)">$1</a>');
    // 表格：| a | b | 格式
    var lines = s.split("\n");
    var html = [];
    var inTable = false;
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      if (line.trim().startsWith("|") && line.trim().endsWith("|")) {
        var cells = line.split("|").slice(1, -1).map(function (c) { return c.trim(); });
        if (cells.every(function (c) { return /^[-: ]+$/.test(c); })) continue; // 分隔行跳过
        if (!inTable) { html.push('<table style="border-collapse:collapse;width:100%;font-size:12px;margin:4px 0">'); inTable = true; }
        html.push("<tr>" + cells.map(function (c) { return '<td style="border:1px solid var(--border);padding:4px 8px">' + c + "</td>"; }).join("") + "</tr>");
      } else {
        if (inTable) { html.push("</table>"); inTable = false; }
        // 无序列表
        if (line.trim().startsWith("- ") || line.trim().startsWith("* ")) {
          html.push("<li style='margin-left:16px'>" + line.trim().slice(2) + "</li>");
        } else if (/^\d+\.\s/.test(line.trim())) {
          html.push("<li style='margin-left:16px;list-style:decimal'>" + line.trim().replace(/^\d+\.\s/, "") + "</li>");
        } else {
          html.push(line);
        }
      }
    }
    if (inTable) html.push("</table>");
    return html.join("\n").replace(/\n/g, "<br>");
  }

  function addMsg(role, text, sources) {
    var el = document.createElement("div");
    el.className = "chat-msg " + role;
    var html = role === "bot" ? mdToHtml(text) : esc(text).replace(/\n/g, "<br>");
    if (sources && sources.length) {
      html += '<div class="chat-sources">📎 ';
      html += sources.slice(0, 5).map(function (s) {
        return '<a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc((s.title || "").slice(0, 30)) + "</a>";
      }).join(" · ");
      html += "</div>";
    }
    el.innerHTML = html;
    msgs.appendChild(el);
    msgs.scrollTop = msgs.scrollHeight;
    return el;
  }

  function addToolLine(tool, args, count) {
    toolsBox.classList.remove("hidden");
    var line = document.createElement("div");
    line.className = "tool-line";
    line.textContent = "🔧 " + tool + "(" + JSON.stringify(args || {}).slice(0, 50) + ")" + (count !== undefined ? " → " + count + " 条" : "…");
    toolsBox.appendChild(line);
    toolsBox.scrollTop = toolsBox.scrollHeight;
  }

  function getPageContext() {
    var items = [];
    document.querySelectorAll(".item[data-url]").forEach(function (el, i) {
      if (i < 10) {
        items.push({
          n: i + 1,
          title: (el.querySelector(".title") || {}).textContent || el.getAttribute("data-title") || "",
          url: el.getAttribute("data-url") || ""
        });
      }
    });
    return items;
  }

  async function send(overrideMessage) {
    var text = overrideMessage || input.value.trim();
    if (!text || sendBtn.disabled) return;
    if (!overrideMessage) input.value = "";
    sendBtn.disabled = true;
    addMsg("user", text);

    var loading = document.createElement("div");
    loading.className = "chat-loading";
    loading.textContent = "思考中";
    msgs.appendChild(loading);
    msgs.scrollTop = msgs.scrollHeight;

    try {
      var resp = await fetch("/api/chat/stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, session_id: sessionId, page_context: getPageContext() })
      });

      var reader = resp.body.getReader();
      var decoder = new TextDecoder();
      var buf = "";
      var finalReply = "";
      var finalSources = [];

      while (true) {
        var chunk = await reader.read();
        if (chunk.done) break;
        buf += decoder.decode(chunk.value, { stream: true });
        var lines = buf.split("\n");
        buf = lines.pop();
        for (var i = 0; i < lines.length; i++) {
          var line = lines[i].trim();
          if (!line.startsWith("data: ")) continue;
          try {
            var ev = JSON.parse(line.slice(6));
            handleEvent(ev);
          } catch (e) { /* 忽略解析失败 */ }
        }
      }
    } catch (e) {
      loading.remove();
      addMsg("bot", "❌ 网络错误");
    }
    loading.remove();
    sendBtn.disabled = false;
    input.focus();

    function handleEvent(ev) {
      switch (ev.type) {
        case "tool":
          addToolLine(ev.tool, ev.args);
          break;
        case "tool_result":
          // 更新最后一条工具行的结果
          var lines = toolsBox.querySelectorAll(".tool-line");
          if (lines.length) {
            var last = lines[lines.length - 1];
            if (ev.count !== undefined) last.textContent = last.textContent.replace("…", " → " + ev.count + " 条");
            else last.textContent = last.textContent.replace("…", " → ✓");
          }
          break;
        case "confirm":
          loading.remove();
          confirmBox.classList.remove("hidden");
          confirmText.textContent = "⚠️ " + ev.description;
          sendBtn.disabled = false;
          break;
        case "reply":
          loading.remove();
          addMsg("bot", ev.content, null);
          finalReply = ev.content;
          break;
        case "sources":
          finalSources = ev.items || [];
          // 更新最后一条 bot 消息加来源
          var botMsgs = msgs.querySelectorAll(".chat-msg.bot");
          if (botMsgs.length && finalSources.length) {
            var lastBot = botMsgs[botMsgs.length - 1];
            var srcHtml = '<div class="chat-sources">📎 ';
            srcHtml += finalSources.slice(0, 5).map(function (s) {
              return '<a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc((s.title || "").slice(0, 30)) + "</a>";
            }).join(" · ");
            srcHtml += "</div>";
            lastBot.innerHTML += srcHtml;
          }
          break;
        case "done":
          sessionId = ev.session_id || sessionId;
          break;
        case "error":
          loading.remove();
          addMsg("bot", "❌ " + ev.message);
          break;
      }
      msgs.scrollTop = msgs.scrollHeight;
    }
  }

  sendBtn.addEventListener("click", function () { send(); });
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });
})();
</script>
