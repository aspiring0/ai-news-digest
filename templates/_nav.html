<header class="site">
  <div class="header-inner">
    <a class="brand" href="/hot">AI <span class="slash">/</span> 资讯聚合</a>
    <nav class="tabs">
      <a href="/hot" class="{{ 'active' if active == 'hot' else '' }}">今日热榜</a>
      <a href="/timeline" class="{{ 'active' if active == 'timeline' else '' }}">时间线</a>
      <a href="/daily" class="{{ 'active' if active == 'daily' else '' }}">日报</a>
      <a href="/topics" class="{{ 'active' if active == 'topics' else '' }}">分类</a>
      <a href="/bookmarks" class="{{ 'active' if active == 'bookmarks' else '' }}">收藏</a>
    </nav>
    <span class="header-actions">
      <form action="/search" method="get" style="display:flex">
        <input type="text" name="q" placeholder="🔍 搜索" class="nav-search" aria-label="搜索">
      </form>
      <button class="icon-btn" data-open-settings title="模型平台设置">⚙ 设置</button>
      <button class="icon-btn" id="theme-toggle" title="切换深色 / 浅色" aria-label="切换深色 / 浅色">🌙</button>
    </span>
  </div>
</header>
