<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}AI 资讯聚合{% endblock %}</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --border:#e5e7eb; --text:#1f2328; --muted:#6b7280;
    --blue:#2563eb; --blue-dark:#1d4ed8; --blue-bg:#eff6ff;
    --amber-bg:#fef3c7; --amber-text:#b45309;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:15px; line-height:1.6;
  }
  a{ color:var(--blue); text-decoration:none; }
  a:hover{ color:var(--blue-dark); text-decoration:underline; }

  /* ---- 顶栏：左标题 + 右 tab ---- */
  header.site{ background:#fff; border-bottom:1px solid var(--border); }
  .header-inner{
    max-width:900px; margin:0 auto; padding:0 16px; min-height:52px;
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  }
  .brand{ font-size:17px; font-weight:700; color:var(--text); white-space:nowrap; }
  nav.tabs{ display:flex; gap:2px; flex-wrap:wrap; }
  nav.tabs a{ padding:6px 12px; border-radius:8px; color:var(--muted); font-weight:500; }
  nav.tabs a:hover{ background:#f0f2f5; color:var(--text); text-decoration:none; }
  nav.tabs a.active{ color:var(--blue); background:var(--blue-bg); font-weight:600; }

  /* ---- 内容区：约 900px 居中 ---- */
  .wrap{ max-width:900px; margin:0 auto; padding:16px; }
  h1{ font-size:22px; margin:8px 0 4px; }
  h2.cat{ font-size:16px; margin:22px 0 10px; border-left:4px solid var(--blue); padding-left:8px; }
  .hint{ color:var(--muted); font-size:13px; margin:0 0 16px; }
  .empty{ color:#9ca3af; padding:40px 0; text-align:center; background:var(--card);
          border:1px dashed var(--border); border-radius:10px; }

  /* ---- 条目行：badge + 标题 + 摘要按钮 + 来源·时间 ---- */
  .item{
    background:var(--card); border:1px solid var(--border); border-radius:10px;
    padding:10px 14px; margin-bottom:10px;
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    box-shadow:0 1px 2px rgba(0,0,0,.03);
  }
  .score{
    flex-shrink:0; background:var(--amber-bg); color:var(--amber-text);
    border-radius:6px; padding:1px 8px; font-weight:700; font-size:13px; font-variant-numeric:tabular-nums;
  }
  .item a.title{ color:var(--blue-dark); font-weight:600; font-size:15px; cursor:pointer;
                 min-width:0; overflow-wrap:anywhere; }
  .item a.title:hover{ text-decoration:underline; }
  .sum-btn{
    flex-shrink:0; border:1px solid #bfdbfe; background:var(--blue-bg); color:var(--blue-dark);
    border-radius:6px; padding:2px 10px; font-size:12px; cursor:pointer;
  }
  .sum-btn:hover{ background:#dbeafe; }
  .item .spacer{ flex:1; }
  .meta{ color:var(--muted); font-size:12px; white-space:nowrap; }
  .star{ flex-shrink:0; border:none; background:none; cursor:pointer; font-size:16px; padding:0 2px; color:#9ca3af; }

  /* ---- 时间线日期分组头 ---- */
  .date-head{ margin:18px 0 8px; font-size:13px; font-weight:600; color:var(--muted);
              display:flex; align-items:center; gap:8px; }
  .date-head::after{ content:""; flex:1; height:1px; background:var(--border); }

  /* ---- 分页 ---- */
  .pager{ margin:20px 0; text-align:center; }
  .pager a, .pager span{ margin:0 8px; text-decoration:none; color:var(--blue); }
  .pager span.cur{ color:var(--text); font-weight:700; }

  .stats-line{ font-size:12px; color:#9ca3af; margin-top:20px; }

  /* ---- 移动端 ---- */
  @media (max-width:640px){
    .header-inner{ padding:6px 12px; }
    nav.tabs a{ padding:5px 8px; font-size:13px; }
    h1{ font-size:19px; }
    .item{ gap:8px; padding:10px 12px; }
    .item a.title{ font-size:14px; flex-basis:100%; order:2; }
    .score{ order:0; } .star{ order:1; margin-left:auto; }
    .sum-btn{ order:3; } .meta{ order:4; white-space:normal; }
  }
</style>
</head>
<body>
{% set active = self.nav_active() | trim %}
{% include "_nav.html" %}
<main class="wrap">
{% block content %}{% endblock %}
</main>
{% include "_summary_modal.html" %}
</body>
</html>
