<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}AI 资讯聚合{% endblock %}</title>
<script>
/* 主题早置：避免深色模式闪白（localStorage > 系统偏好） */
(function () {
  try {
    var t = localStorage.getItem("theme");
    if (t !== "dark" && t !== "light") {
      t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    document.documentElement.dataset.theme = t;
  } catch (e) {}
})();
</script>
<style>
  /* ============ 刊物风 Editorial：暖纸底 / 衬线标题 / 细线列表 ============ */
  :root{
    --bg:#faf9f6; --card:#ffffff; --border:#e7e5e4; --text:#1c1917; --muted:#78716c;
    --blue:#1d4ed8; --blue-dark:#1e40af; --blue-bg:#eff3fb;
    --amber-bg:#fef3c7; --amber-text:#b45309;
    --rank-dim:#d6d3d1;
    --serif:Georgia,"Noto Serif SC","Songti SC","SimSun",serif;
    --shadow:none;
  }
  html[data-theme="dark"]{
    --bg:#16130f; --card:#201c17; --border:#3a342c; --text:#ece9e4; --muted:#a8a29e;
    --blue:#8fb1f5; --blue-dark:#c3d4fa; --blue-bg:#1c2a45;
    --amber-bg:#451a03; --amber-text:#fbbf24;
    --rank-dim:#4a4339;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:15px; line-height:1.6;
  }
  a{ color:var(--blue); text-decoration:none; }
  a:hover{ color:var(--blue-dark); text-decoration:underline; }

  /* ---- 刊头：衬线品牌 + 双线 + 文字 tab ---- */
  header.site{ background:var(--bg); border-bottom:2px solid var(--text); }
  .header-inner{
    max-width:880px; margin:0 auto; padding:14px 20px 10px;
    display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap;
  }
  .brand{ font-family:var(--serif); font-size:21px; font-weight:800; color:var(--text); white-space:nowrap; letter-spacing:.01em; }
  .brand .slash{ color:var(--blue); font-style:normal; }
  nav.tabs{ display:flex; gap:2px; flex-wrap:wrap; }
  nav.tabs a{ padding:4px 10px; color:var(--muted); font-weight:500; font-size:13.5px; letter-spacing:.06em; border-bottom:2px solid transparent; }
  nav.tabs a:hover{ color:var(--text); text-decoration:none; background:none; }
  nav.tabs a.active{ color:var(--text); font-weight:700; border-bottom-color:var(--blue); background:none; }
  .header-actions{ display:flex; gap:8px; align-items:center; }
  .icon-btn{
    flex-shrink:0; border:1px solid var(--border); background:var(--card); border-radius:6px;
    height:32px; padding:0 10px; cursor:pointer; font-size:12.5px; line-height:1;
    display:flex; align-items:center; justify-content:center; color:var(--text); font-family:inherit;
  }
  .icon-btn:hover{ background:var(--bg); }

  /* ---- utility bar ---- */
  .utility-bar{ border-bottom:1px solid var(--border); }
  .utility-inner{
    max-width:880px; margin:0 auto; padding:5px 20px;
    display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
  }
  .u-update{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); }
  .pulse{ width:8px; height:8px; border-radius:50%; background:#22c55e; animation:pulse 2s infinite; flex-shrink:0; }
  @keyframes pulse{ 0%{box-shadow:0 0 0 0 rgba(34,197,94,.45);} 70%{box-shadow:0 0 0 7px rgba(34,197,94,0);} 100%{box-shadow:0 0 0 0 rgba(34,197,94,0);} }
  .u-right{ display:flex; align-items:center; gap:8px; }
  .u-engine{
    border:none; border-bottom:1px dotted var(--muted); background:none; color:var(--text); border-radius:0;
    padding:2px 0; font-size:12px; cursor:pointer; max-width:300px; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; font-family:inherit;
  }
  .u-engine:hover{ color:var(--blue-dark); border-bottom-color:var(--blue); }
  .u-refresh{ border:none; background:none; color:var(--muted); cursor:pointer; font-size:12px; padding:3px 6px; font-family:inherit; }
  .u-refresh:hover{ color:var(--blue-dark); }

  /* ---- 内容区 ---- */
  .wrap{ max-width:880px; margin:0 auto; padding:18px 20px 30px; }
  h1{ font-family:var(--serif); font-size:21px; margin:10px 0 4px; }
  h2.cat{ font-family:var(--serif); font-size:16px; margin:20px 0 8px; border-left:3px solid var(--blue); padding-left:8px; }
  .hint{ color:var(--muted); font-size:12.5px; margin:0 0 14px; }
  .empty{ color:var(--muted); padding:40px 0; text-align:center; border:1px dashed var(--border); }

  /* ---- lead strip：刊首头条 ---- */
  .lead{ display:flex; gap:22px; align-items:flex-start; margin:0 0 6px; padding:0 0 18px; border-bottom:2px solid var(--text); }
  .lead-left{ flex:1; min-width:0; }
  .lead-brand{ font-size:10.5px; font-weight:800; letter-spacing:.22em; color:var(--blue); text-transform:uppercase; }
  .lead-title{
    display:block; font-family:var(--serif); font-size:25px; font-weight:700; color:var(--text);
    margin:6px 0 8px; overflow-wrap:anywhere; line-height:1.35;
  }
  .lead-title:hover{ color:var(--blue-dark); text-decoration:none; }
  .lead-why{ border:none; background:none; color:var(--blue); border-bottom:1px dashed var(--blue);
             padding:1px 0; font-size:12.5px; cursor:pointer; font-family:inherit; }
  .lead-why:hover{ color:var(--blue-dark); }
  .lead-score{ flex-shrink:0; min-width:92px; text-align:center; border-left:1px solid var(--border); padding:6px 0 6px 20px; }
  .lead-score span{ font-size:10px; letter-spacing:.16em; color:var(--muted); display:block; }
  .lead-score b{ font-family:var(--serif); font-size:27px; color:var(--amber-text); font-variant-numeric:tabular-nums; }

  /* ---- 筛选：文字链接式 ---- */
  .chips{ display:flex; gap:14px; flex-wrap:wrap; margin:14px 0 4px; padding-bottom:9px; border-bottom:1px solid var(--border); }
  .chip{ border:none; background:none; color:var(--muted); border-radius:0; padding:2px 0;
         font-size:12.5px; cursor:pointer; font-family:inherit; border-bottom:2px solid transparent; letter-spacing:.04em; }
  .chip:hover{ color:var(--text); }
  .chip.active{ color:var(--text); font-weight:700; border-bottom-color:var(--text); }
  .chip-n{ opacity:.55; font-size:11px; margin-left:3px; }

  /* ---- 条目：细线列表（无卡片） ---- */
  .item{ background:none; border:none; border-bottom:1px solid var(--border); border-radius:0;
         padding:14px 0 12px; margin:0; box-shadow:none; }
  .row-main{ display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
  .row-sub{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-top:4px; padding-left:46px; }
  .rank{
    flex-shrink:0; width:34px; font-family:var(--serif); font-size:23px; font-weight:400;
    color:var(--rank-dim); text-align:right; line-height:1.15; font-variant-numeric:tabular-nums;
    background:none; border:none; padding:0; height:auto; min-width:0;
  }
  .rank.r1, .rank.r2, .rank.r3{ color:var(--amber-text); font-weight:800; }
  .rank.dim{ color:var(--rank-dim); }
  .cat-badge{ flex-shrink:0; font-size:10.5px; font-weight:700; letter-spacing:.12em; padding:0;
              border-radius:0; background:transparent !important; white-space:nowrap; }
  .cb-model{ color:#1d4ed8; } .cb-app{ color:#15803d; } .cb-policy{ color:#6d28d9; }
  .cb-finance{ color:#c2410c; } .cb-robot{ color:#0e7490; } .cb-other{ color:var(--muted); }
  html[data-theme="dark"] .cb-model{ color:#93c5fd; } html[data-theme="dark"] .cb-app{ color:#86efac; }
  html[data-theme="dark"] .cb-policy{ color:#c4b5fd; } html[data-theme="dark"] .cb-finance{ color:#fdba74; }
  html[data-theme="dark"] .cb-robot{ color:#67e8f9; }
  .score{ flex-shrink:0; background:none; color:var(--amber-text); border-radius:0; padding:0;
          font-weight:700; font-size:12.5px; font-variant-numeric:tabular-nums; }
  .item a.title{ font-family:var(--serif); color:var(--text); font-weight:700; font-size:16px;
                 min-width:0; overflow-wrap:anywhere; line-height:1.4; }
  .item a.title:hover{ color:var(--blue-dark); text-decoration:underline; }
  .sum-btn{ flex-shrink:0; border:none; background:none; color:var(--blue); border-radius:0;
            border-bottom:1px dashed var(--blue); padding:0 0 1px; font-size:12.5px; cursor:pointer; font-family:inherit; }
  .sum-btn:hover{ color:var(--blue-dark); }
  .row-main .spacer{ flex:1; }
  .meta{ color:var(--muted); font-size:12px; }
  .meta b{ color:var(--text); font-weight:600; }
  .star{ flex-shrink:0; border:none; background:none; cursor:pointer; font-size:15px; padding:0 2px; color:#a8a29e; align-self:center; }

  .slim-list .item{ padding:9px 0 8px; }
  .slim-list .item a.title{ font-size:14.5px; }
  .slim-list .row-sub{ padding-left:46px; }

  /* ---- 故事合并徽标 + 各源列表 ---- */
  .story-badge{
    flex-shrink:0; font-size:10.5px; font-weight:700; letter-spacing:.06em;
    color:var(--amber-text); border:1px solid currentColor; border-radius:4px;
    padding:0 6px; white-space:nowrap;
  }
  .story-members{ margin:6px 0 0 46px; font-size:12.5px; }
  .story-members summary{ cursor:pointer; color:var(--muted); font-size:12px; letter-spacing:.04em; }
  .story-members summary:hover{ color:var(--blue-dark); }
  .story-members ul{ margin:6px 0 0; padding-left:16px; }
  .story-members li{ margin:2px 0; overflow-wrap:anywhere; }
  @media (max-width:640px){ .story-members{ margin-left:0; } }

  /* ---- 日期分组头 ---- */
  .date-head{ margin:20px 0 6px; font-size:12.5px; font-weight:700; color:var(--muted);
              display:flex; align-items:center; gap:8px; letter-spacing:.08em; }
  .date-head::after{ content:""; flex:1; height:1px; background:var(--border); }

  /* ---- 分页 ---- */
  .pager{ margin:22px 0; text-align:center; font-size:13px; }
  .pager a, .pager span{ margin:0 8px; text-decoration:none; color:var(--blue); }
  .pager span.cur{ color:var(--text); font-weight:700; }

  .stats-line{ font-size:11px; color:var(--muted); margin-top:22px; letter-spacing:.08em; }

  /* ---- 设置抽屉 ---- */
  .drawer-mask{ position:fixed; inset:0; background:rgba(28,25,23,.42); z-index:60; opacity:0; pointer-events:none; transition:opacity .2s; }
  .drawer{ position:fixed; top:0; right:0; bottom:0; width:min(480px, 100vw); z-index:61;
           background:var(--bg); border-left:1px solid var(--border); transform:translateX(100%);
           transition:transform .25s ease; display:flex; flex-direction:column; }
  body.drawer-open .drawer-mask{ opacity:1; pointer-events:auto; }
  body.drawer-open .drawer{ transform:translateX(0); }
  .drawer-head{ display:flex; justify-content:space-between; align-items:center; padding:12px 16px;
                border-bottom:2px solid var(--text); background:var(--bg); }
  .drawer-head b{ font-family:var(--serif); font-size:15px; }
  .drawer-close{ border:none; background:none; font-size:18px; cursor:pointer; color:var(--muted); }
  .drawer iframe{ flex:1; width:100%; border:none; background:var(--bg); }

  /* ---- 移动端 ---- */
  @media (max-width:640px){
    .header-inner{ padding:10px 14px 8px; }
    nav.tabs a{ padding:4px 7px; font-size:12.5px; }
    h1{ font-size:18px; }
    .lead{ flex-direction:column; gap:10px; }
    .lead-title{ font-size:20px; }
    .lead-score{ border-left:none; padding:0; text-align:left; display:flex; align-items:baseline; gap:8px; }
    .row-main{ gap:8px; }
    .rank{ width:28px; font-size:19px; }
    .row-sub{ padding-left:0; }
    .item a.title{ font-size:15px; flex-basis:100%; order:5; }
    .u-engine{ max-width:170px; }
  }
</style>
</head>
<body>
{% set active = self.nav_active() | trim %}
{% include "_nav.html" %}
<div class="utility-bar">
  <div class="utility-inner">
    <span class="u-update"><span class="pulse"></span><span id="u-updated">读取更新时间…</span></span>
    <span class="u-right">
      <button class="u-engine" id="u-engine" title="模型平台设置">模型状态…</button>
      <button class="u-refresh" id="u-refresh" title="手动抓取一轮并刷新">↻ 刷新</button>
    </span>
  </div>
</div>
<main class="wrap">
{% block content %}{% endblock %}
</main>
{% include "_summary_modal.html" %}

<!-- 设置抽屉：iframe 承载 /settings 全部功能（零接口依赖） -->
<div class="drawer-mask" id="drawer-mask"></div>
<aside class="drawer" id="settings-drawer" aria-label="模型平台">
  <div class="drawer-head"><b>模型平台</b><button class="drawer-close" id="drawer-close" aria-label="关闭">✕</button></div>
  <iframe id="settings-frame" title="模型平台设置"></iframe>
</aside>

<script>
/* ---------- 前端分类器：规则与 app/classifier.py 保持同步（改那边记得同步这里） ---------- */
var CAT_RULES = [
  ["政策与监管", ["监管","立法","法案","合规","审查","禁令","白宫","行政令","FTC","欧盟","AI Act","regulation","compliance","lawsuit","court ruling","ban","executive order","antitrust"]],
  ["融资与公司动态", ["融资","估值","IPO","收购","并购","亿美元","轮融资","上市","raises","funding","valuation","acquisition","acquires","billion","million round"]],
  ["具身智能与机器人", ["机器人","人形","具身","机械臂","四足","无人机","自动驾驶","robot","humanoid","embodied","drone","self-driving","autonomous vehicle"]],
  ["AI 大模型", ["大模型","LLM","GPT","Claude","Gemini","Llama","Qwen","DeepSeek","Kimi","GLM","文心","混元","foundation model","frontier model","推理模型","多模态","开源模型","open weights","benchmark"]],
  ["AI 应用", ["应用","App","Copilot","助手","智能体","Agent","搜索","办公","编程","代码","绘画","视频生成","音乐","教育","医疗","agent","copilot","assistant","coding","productivity"]]
];
function classifyTitle(t) {
  var s = String(t || "").toLowerCase();
  for (var i = 0; i < CAT_RULES.length; i++) {
    var kws = CAT_RULES[i][1];
    for (var j = 0; j < kws.length; j++) if (s.indexOf(kws[j].toLowerCase()) !== -1) return CAT_RULES[i][0];
  }
  return "其他";
}
var CAT_CLASS = {"AI 大模型":"cb-model","AI 应用":"cb-app","政策与监管":"cb-policy","融资与公司动态":"cb-finance","具身智能与机器人":"cb-robot","其他":"cb-other"};

/* 给所有条目插彩色分类 badge，并记 data-cat 供筛选 */
(function () {
  document.querySelectorAll(".item[data-title]").forEach(function (el) {
    var cat = classifyTitle(el.getAttribute("data-title"));
    el.setAttribute("data-cat", cat);
    var main = el.querySelector(".row-main");
    if (!main || main.querySelector(".cat-badge")) return;
    var badge = document.createElement("span");
    badge.className = "cat-badge " + (CAT_CLASS[cat] || "cb-other");
    badge.textContent = cat;
    var anchor = main.querySelector("a.title");
    main.insertBefore(badge, anchor);
  });
  document.dispatchEvent(new CustomEvent("ai:classified"));
})();

/* ---------- 设置抽屉 ---------- */
function openSettingsDrawer() {
  document.body.classList.add("drawer-open");
  var f = document.getElementById("settings-frame");
  if (f && !f.getAttribute("src")) f.setAttribute("src", "/settings");
}
(function () {
  var mask = document.getElementById("drawer-mask");
  document.getElementById("drawer-close").addEventListener("click", function () { document.body.classList.remove("drawer-open"); });
  if (mask) mask.addEventListener("click", function () { document.body.classList.remove("drawer-open"); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") document.body.classList.remove("drawer-open"); });
  document.querySelectorAll("[data-open-settings]").forEach(function (b) { b.addEventListener("click", openSettingsDrawer); });

  /* 更新时间：来自现有 /api/health 的 last_fetch */
  fetch("/api/health").then(function (r) { return r.json(); }).then(function (h) {
    var el = document.getElementById("u-updated");
    if (el && h.last_fetch && typeof relTime === "function") {
      el.textContent = "更新于 " + relTime(h.last_fetch);
    } else if (el) { el.textContent = "尚未完成抓取"; }
  }).catch(function () {
    var el = document.getElementById("u-updated");
    if (el) el.textContent = "更新时间获取失败";
  });

  /* 刷新 = 手动触发一轮抓取（后端 /api/refetch，同步约 10-30s），完成后自动 reload */
  document.getElementById("u-refresh").addEventListener("click", function () {
    var btn = this;
    btn.disabled = true;
    btn.textContent = "抓取中…";
    fetch("/api/refetch", { method: "POST" }).then(function (r) { return r.json(); }).then(function (d) {
      if (d.ok) { location.reload(); } else { btn.textContent = "↻ 刷新"; btn.disabled = false; }
    }).catch(function () { btn.textContent = "↻ 刷新"; btn.disabled = false; });
  });
})();

/* ---------- 默认引擎信息：解析 /settings 已渲染 HTML（无独立 JSON 接口，纯前端方案） ---------- */
var getEngineInfo = (function () {
  var cached = null;
  return function () {
    if (cached) return cached;
    cached = fetch("/settings").then(function (r) { return r.text(); }).then(function (html) {
      var doc = new DOMParser().parseFromString(html, "text/html");
      var badge = doc.querySelector(".card.saved .badge");
      if (!badge) return null; /* 无默认引擎 */
      var card = badge.closest(".card");
      var name = card.querySelector(".card-head b").textContent.trim();
      var model = (card.querySelector(".f-model") || {}).value || "";
      return { name: name, model: model.trim() };
    }).catch(function () { return null; });
    return cached;
  };
})();
(function () {
  var btn = document.getElementById("u-engine");
  if (!btn) return;
  btn.addEventListener("click", openSettingsDrawer);
  getEngineInfo().then(function (info) {
    btn.textContent = info ? ("当前：" + info.name + " · " + (info.model || "默认模型")) : "设置模型";
  });
})();

/* ---------- 来源筛选 chips（热榜/时间线/收藏） ---------- */
(function () {
  var chips = document.getElementById("src-chips");
  if (!chips) return;
  var items = Array.from(document.querySelectorAll(".item[data-source]"));
  chips.addEventListener("click", function (e) {
    var btn = e.target.closest(".chip");
    if (!btn) return;
    chips.querySelectorAll(".chip").forEach(function (c) { c.classList.toggle("active", c === btn); });
    var src = btn.dataset.src;
    items.forEach(function (it) {
      it.style.display = (!src || it.dataset.source === src) ? "" : "none";
    });
  });
  chips.querySelectorAll(".chip").forEach(function (c) {
    var n = c.dataset.src
      ? items.filter(function (i) { return i.dataset.source === c.dataset.src; }).length
      : items.length;
    c.querySelector(".chip-n").textContent = n;
  });
})();

/* ---------- 深浅色切换 ---------- */
(function () {
  var btn = document.getElementById("theme-toggle");
  if (!btn) return;
  var icon = function () { btn.textContent = document.documentElement.dataset.theme === "dark" ? "☀️" : "🌙"; };
  icon();
  btn.addEventListener("click", function () {
    var next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("theme", next); } catch (e) {}
    icon();
  });
})();
</script>
</body>
</html>
